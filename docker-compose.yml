version: '3.8'

services:
  # ─── Database ──────────────────────────────────────────────
  database:
    image: mongo:6
    container_name: smart_leads_db
    restart: unless-stopped
    ports:
      - "27017:27017" # Optional: Remove in pure prod if connecting directly via internal network
    volumes:
      - mongo_data:/data/db
    networks:
      - smart_leads_network
    # Healthcheck to ensure Mongo is ready before backend starts
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─── Backend API ───────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: smart_leads_api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://database:27017/smart_leads
      - JWT_SECRET=${JWT_SECRET:-super_secret_jwt_key_please_change_in_prod}
      - JWT_EXPIRES_IN=1h
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-super_secret_refresh_key_please_change}
      - JWT_REFRESH_EXPIRES_IN=7d
      - CORS_ORIGIN=http://localhost:80 # Match frontend port
    networks:
      - smart_leads_network
    depends_on:
      database:
        condition: service_healthy
    # Persist Winston logs outside container lifecycle
    volumes:
      - backend_logs:/app/logs

  # ─── Frontend Dashboard ────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smart_leads_ui
    restart: unless-stopped
    ports:
      - "80:80" # Nginx serves on port 80 internally
    networks:
      - smart_leads_network
    depends_on:
      - backend

# ─── Volumes ───────────────────────────────────────────────
volumes:
  mongo_data:
    name: smart_leads_mongo_data
  backend_logs:
    name: smart_leads_backend_logs

# ─── Networks ──────────────────────────────────────────────
networks:
  smart_leads_network:
    name: smart_leads_network
    driver: bridge
